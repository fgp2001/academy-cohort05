<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Lista de Tareas en Vanilla JS</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="container">
        <h1>Lista de Tareas</h1>
        <form id="form" class="form-inline">
            <input id="input" type="text" class="form-control" placeholder="Agregue una nueva tarea">
            <button class="btn btn-primary" type="submit">
                Agregar Tarea
            </button>
            <ul id="lista" class="list-group">
            </ul>
        </form>
    </main>
    <script src="script.js"></script>
</body>

</html>
