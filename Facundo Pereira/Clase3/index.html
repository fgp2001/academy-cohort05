<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Lista de Tareas en Vanilla JS</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="container">
        <h1>Lista de Tareas</h1>
        <form id="form" class="form-inline">
            <input id="input" type="text" class="form-control" placeholder="Agregue una nueva tarea">
            <button class="btn btn-primary" type="submit">
                Agregar Tarea
            </button>
            <ul id="lista" class="list-group">
            </ul>
        </form>
        <div id="filtros">
            <button type="button" data-filtro="todas">
                Todas
            </button>
            <button type="button" data-filtro="pendientes">
                Pendientes
            </button>
            <button type="button" data-filtro="hechas">
                Hechas
            </button>
        </div>
        <p id="contador">
            0 pendientes
        </p>
        <ul id="lista" class="list-group">
        </ul>
    </main>
    <script src="script.js" defer></script>
</body>
</html>
